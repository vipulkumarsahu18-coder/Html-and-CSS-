<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        .content-box {
            width: 200px;
            padding: 20px;
            border: 5px solid black;
            box-sizing: content-box;
            background-color: lightblue;
            margin-bottom: 20px;
        }

        .border-box {
            width: 200px;
            padding: 20px;
            border: 5px solid black;
            box-sizing: border-box;
            background-color: lightgreen;
        }
    </style>
</head>
<body>

    <h1>CSS Box Model</h1>

    <div class="content-box">
        Content Box
    </div>

    <div class="border-box">
        Border Box
    </div>

</body>
</html>
