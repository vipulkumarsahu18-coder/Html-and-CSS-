<!DOCTYPE html>
<html>
<head>
    <title>CSS Card</title>

    <style>
        .card {
            background-color: lightblue;
            border: 2px solid black;
            border-radius: 12px;
            padding: 16px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>My First Card</h3>
        <p>This is a simple card created using CSS.</p>
    </div>

</body>
</html>
