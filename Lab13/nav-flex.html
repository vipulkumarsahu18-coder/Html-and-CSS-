<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar using Flexbox</title>

    <style>
        nav {
            display: flex;
            background-color: #333;
            padding: 15px;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Events</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
